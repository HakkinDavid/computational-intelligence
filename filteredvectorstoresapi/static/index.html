<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FilteredVectorStore</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            max-width: 1400px;
        }

        textarea,
        input,
        button {
            font-size: 16px;
        }

        textarea {
            width: 100%;
            height: 180px;
            resize: vertical;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        .fila {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 320px 1fr;
            gap: 20px;
            margin-top: 20px;
            align-items: start;
        }

        .panel {
            border: 1px solid #ccc;
            padding: 15px;
        }

        .panel h3 {
            margin-top: 0;
        }

        .documento {
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            padding: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .documento.activo {
            background: black;
            color: white;
        }

        .metadata {
            color: #666;
            margin-top: 10px;
            line-height: 1.5;
        }

        .texto-documento {
            line-height: 1.8;
            white-space: pre-wrap;
            margin-top: 30px;
            font-size: 18px;
        }

        .resultado {
            border-top: 1px solid #ddd;
            padding-top: 10px;
            margin-top: 10px;
        }

        .score {
            font-weight: bold;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #estado {
            color: #666;
        }

        .documento-word {
            background: white;
            min-height: 900px;
            padding: 80px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
        }

        .subtitulo {
            color: #666;
            margin-top: 5px;
        }

        .resultado-item {
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            padding: 10px;
        }

        .resultado-item.activo {
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>FilteredVectorStore</h1>
        <div id="estado"></div>
    </div>

    <textarea id="texto" placeholder="texto del documento"></textarea>

    <div class="fila">
        <input id="category" placeholder="category">
        <input id="location" placeholder="location">
        <button onclick="crear()">Crear documento</button>
    </div>

    <div class="fila">
        <input id="query" placeholder="semantic query" oninput="buscar()">
    </div>

    <div class="fila">
        <input id="document_id" placeholder="document id">
        <button onclick="obtener()">Obtener por ID</button>
    </div>

    <div class="layout">
        <div class="panel">
            <h3>Documentos</h3>
            <div id="documentos"></div>
        </div>

        <div class="panel">
            <h3>Resultados</h3>
            <div id="resultados"></div>
        </div>

        <div class="documento-word">
            <h1 id="titulo">Visualizador</h1>

            <div id="metadata" class="metadata"></div>

            <div id="texto_documento" class="texto-documento"></div>
        </div>
    </div>

    <script>
        let documentos_actuales = []
        let documento_activo = null
        let todos_los_documentos = []
        let timeout_busqueda = null

        function estado(texto) {
            document.getElementById("estado").textContent = texto
        }

        async function crear() {
            estado("Creando documento...")

            const response = await fetch("/documents", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: document.getElementById("texto").value,
                    category: document.getElementById("category").value,
                    location: document.getElementById("location").value
                })
            })

            const resultado = await response.json()

            document.getElementById("document_id").value = resultado.id

            estado(`Documento creado: ${resultado.id}`)

            todos()
        }

        async function buscar() {
            clearTimeout(timeout_busqueda)

            timeout_busqueda = setTimeout(async () => {
                const query = document.getElementById("query").value

                if (!query.trim()) {
                    resultados_actuales = []
                    document.getElementById("resultados").innerHTML = ""
                    estado(`${todos_los_documentos.length} documentos en memoria`)
                    return
                }

                estado("Buscando...")

                const response = await fetch("/documents/search", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        query
                    })
                })

                const resultados = await response.json()

                resultados_actuales = resultados.map(r => ({
                    id: r.metadata.document_id,
                    text: r.text,
                    metadata: r.metadata,
                    score: r.score
                }))

                renderizar_resultados(resultados_actuales)

                documentos_actuales = todos_los_documentos

                documento_activo = null

                if (resultados_actuales.length > 0)
                    visualizar(resultados_actuales[0])

                estado(`${resultados_actuales.length} resultados encontrados`)
            }, 250)
        }

        async function obtener() {
            const id = document.getElementById("document_id").value

            if (!id)
                return

            estado(`Obteniendo ${id}...`)

            const response = await fetch(`/documents/${id}`)

            const documento = await response.json()

            visualizar(documento)

            estado(`Documento ${id} cargado`)
        }

        async function todos() {
            estado("Cargando documentos...")

            const response = await fetch("/documents/all")

            todos_los_documentos = await response.json()

            documentos_actuales = todos_los_documentos

            renderizar(documentos_actuales)

            estado(`${documentos_actuales.length} documentos en memoria`)
        }

        function renderizar(documentos) {
            document.getElementById("documentos").innerHTML = documentos
                .map(documento => `
                    <button
                        class="documento ${documento_activo === documento.id ? "activo" : ""}"
                        onclick='visualizar(${JSON.stringify(documento)})'>
                        ${documento.id}
                    </button>
                `)
                .join("")
        }

        function renderizar_resultados(documentos) {
            document.getElementById("resultados").innerHTML = documentos
                .map(documento => `
                    <button
                        class="resultado-item ${documento_activo === documento.id ? "activo" : ""}"
                        onclick='visualizar(${JSON.stringify(documento)})'>

                        <div>
                            ${(documento.score * 100).toFixed(2)}%
                        </div>

                        <div>
                            ${documento.id}
                        </div>
                    </button>
                `)
                .join("")
        }

        function visualizar(documento) {
            documento_activo = documento.id

            renderizar(documentos_actuales)
            renderizar_resultados(
                Array.from(document.getElementById("resultados").children).length
                    ? JSON.parse(JSON.stringify(
                        documentos_actuales.filter(d => d.score !== undefined)
                    ))
                    : []
            )

            document.getElementById("titulo").textContent = documento.id

            document.getElementById("metadata").innerHTML = `
                <div class="subtitulo">
                    category: ${documento.metadata.category || "-"}
                </div>

                <div class="subtitulo">
                    location: ${documento.metadata.location || "-"}
                </div>
            `

            document.getElementById("texto_documento").textContent =
                documento.text
        }

        todos()
    </script>
</body>
</html>
