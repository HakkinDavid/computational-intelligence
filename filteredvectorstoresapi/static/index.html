<!--el diseño se lo aventó Gregorio Patricio Terrazas Quinto-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FilteredVectorStore</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            max-width: 1400px;
        }

        textarea,
        input,
        button {
            font-size: 16px;
        }

        textarea {
            width: 100%;
            height: 180px;
            resize: vertical;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        .fila {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .panel {
            border: 1px solid #ccc;
            padding: 15px;
        }

        .documento {
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            padding: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .documento.activo {
            background: black;
            color: white;
        }

        .metadata {
            background: #f3f3f3;
            padding: 10px;
            overflow-x: auto;
        }

        .texto-documento {
            line-height: 1.6;
            white-space: pre-wrap;
            margin-top: 20px;
        }

        .resultado {
            border-top: 1px solid #ddd;
            padding-top: 10px;
            margin-top: 10px;
        }

        .score {
            font-weight: bold;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #estado {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>FilteredVectorStore</h1>
        <div id="estado"></div>
    </div>

    <textarea id="texto" placeholder="texto del documento"></textarea>

    <div class="fila">
        <input id="category" placeholder="category">
        <input id="location" placeholder="location">
        <button onclick="crear()">Crear documento</button>
    </div>

    <div class="fila">
        <input id="query" placeholder="semantic query">
        <button onclick="buscar()">Buscar</button>
        <button onclick="todos()">Todos</button>
    </div>

    <div class="fila">
        <input id="document_id" placeholder="document id">
        <button onclick="obtener()">Obtener por ID</button>
    </div>

    <div class="layout">
        <div class="panel">
            <h3>Documentos</h3>
            <div id="documentos"></div>
        </div>

        <div class="panel">
            <h2 id="titulo">Visualizador</h2>

            <div id="metadata" class="metadata"></div>

            <div id="texto_documento" class="texto-documento"></div>

            <div id="resultados"></div>
        </div>
    </div>

    <script>
        let documentos_actuales = []
        let documento_activo = null

        function estado(texto) {
            document.getElementById("estado").textContent = texto
        }

        async function crear() {
            estado("Creando documento...")

            const response = await fetch("/documents", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: document.getElementById("texto").value,
                    category: document.getElementById("category").value,
                    location: document.getElementById("location").value
                })
            })

            const resultado = await response.json()

            document.getElementById("document_id").value = resultado.id

            estado(`Documento creado: ${resultado.id}`)

            todos()
        }

        async function buscar() {
            estado("Buscando...")

            const response = await fetch("/documents/search", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    query: document.getElementById("query").value
                })
            })

            const resultados = await response.json()

            documentos_actuales = resultados.map(r => ({
                id: r.metadata.document_id,
                text: r.text,
                metadata: r.metadata,
                score: r.score
            }))

            renderizar(documentos_actuales)

            document.getElementById("resultados").innerHTML = resultados
                .map(r => `
                    <div class="resultado">
                        <div class="score">
                            similitud: ${(r.score * 100).toFixed(2)}%
                        </div>

                        <pre>${JSON.stringify(r.metadata, null, 2)}</pre>

                        <div>${r.text}</div>
                    </div>
                `)
                .join("")

            estado(`${resultados.length} resultados encontrados`)
        }

        async function obtener() {
            const id = document.getElementById("document_id").value

            if (!id)
                return

            estado(`Obteniendo ${id}...`)

            const response = await fetch(`/documents/${id}`)

            const documento = await response.json()

            visualizar(documento)

            estado(`Documento ${id} cargado`)
        }

        async function todos() {
            estado("Cargando documentos...")

            const response = await fetch("/documents/all")

            documentos_actuales = await response.json()

            renderizar(documentos_actuales)

            document.getElementById("resultados").innerHTML = ""

            estado(`${documentos_actuales.length} documentos en memoria`)
        }

        function renderizar(documentos) {
            document.getElementById("documentos").innerHTML = documentos
                .map(documento => `
                    <button
                        class="documento ${documento_activo === documento.id ? "activo" : ""}"
                        onclick='visualizar(${JSON.stringify(documento)})'>
                        ${documento.id}
                    </button>
                `)
                .join("")
        }

        function visualizar(documento) {
            documento_activo = documento.id

            renderizar(documentos_actuales)

            document.getElementById("titulo").textContent = documento.id

            document.getElementById("metadata").textContent =
                JSON.stringify(documento.metadata, null, 2)

            document.getElementById("texto_documento").textContent =
                documento.text
        }

        todos()
    </script>
</body>
</html>
